# Chapter 21, Power Reserve Test: a whole 64 h 51 min take of a
# Dandong 3235, fully wound at the start and left dial up until it
# stopped, 59.8 h in; the last 5 h are the stand with no watch.
output = "power-reserve.png"

actions = [["sleep", 600]]

# 1 Series, 2 the position, 3 Keep Sound, 4 New Test, 5 Save as CSV,
# 6 Copy, 7 Info, above the toolbar; 8 the title, 9 the rate, 10 the
# amplitude, 11 the beat error, 12 the hour table.
marks = [[1, 196, 370], [2, 342, 370], [3, 538, 370], [4, 620, 370], [5, 702, 370],
         [6, 763, 370], [7, 1786, 370], [8, 290, 430], [9, 1000, 572], [10, 1000, 760],
         [11, 1000, 925], [12, 135, 480]]

layout = ["column", [0.18, "Strip"], [0.82, "PowerReserve"]]

[data]
corpus = "ym42_DU_65h"

[data.session]
watch = "Dandong 3235"
calibre = "Dandong 3235"
bph = 28800
