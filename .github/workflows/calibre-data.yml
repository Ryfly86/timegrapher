name: Calibre data

# Publishes the calibre table, as `timegrapher calibres export --json`
# writes it (timegrapher.calibres-export/1), for opentimegrapher.org's
# calibre pages, and later for the app's calibre-data check (#2287). After
# a push to main that could change it, a changed export replaces the file
# at one fixed address:
#
#   https://github.com/peterhudson/timegrapher/releases/download/calibre-data/calibres-export.json.gz
#
# The paths are wide (all of core and the CLI, and the version and lock
# files) so the list can't fall behind the code the export reads. Most such
# pushes leave the export as it was: the run compares it with the published
# file, leaving out the `software` block (commit and build date, new on
# every build), and publishes nothing when the rest is unchanged.
#
# The file sits on a rolling release tagged `calibre-data`, moved to the
# commit it was made from. That release is a pre-release and is never made
# "latest": the app's update check reads releases/latest (core update.rs),
# so the last step fails the run if "latest" stops being a v* release. The
# export carries links to makers' files only; nothing is copied here.
#
# Not a required check, and never run on pull requests. When the secret
# CLOUDFLARE_SITE_DEPLOY_HOOK is set the site is asked to rebuild after a
# changed export, and on every run by hand or re-run even when the export
# is unchanged (#2310), so a failed or missed hook call can be made again.
# Without the secret the run still passes and the site takes the new data on
# its next build.
#
# Only a verified 404 means "nothing published"; any other failed lookup
# stops the run (#2427). The tag moves only from the commit the first step
# read, and only forward (no force), so a stale run can't move it back.
#
# Run by hand with "dry run" ticked, on any branch, it builds, checks and
# compares the export and says what it would do, but moves no tag,
# publishes nothing and calls no hook.
on:
  push:
    branches: [main]
    paths:
      - "crates/timegrapher-core/**"
      - "crates/timegrapher-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/calibre-data.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, check and compare only; publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

# One run at a time, so an older commit's data never replaces a newer one's.
# A newer push waits for the running one; GitHub keeps one waiting run per
# group, so a later push replaces a waiting one. The first step also skips
# a run whose commit is older than the one calibre-data already holds.
# Dry runs wait in a group of their own, so one never replaces a waiting
# real run.
concurrency:
  group: calibre-data${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  publish:
    # Run by hand from another branch, it would publish that branch's table;
    # a dry run publishes nothing, so it may run anywhere.
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The token goes only to the steps that call gh, never to the build,
    # whose dependency build scripts would otherwise see a write token.
    env:
      TAG: calibre-data
      ASSET: calibres-export.json.gz
    steps:
      # A re-run of an old run, or a run that waited behind a newer one,
      # must not put back older data. Main's head is not the test: a later
      # push that misses the paths above starts no run of its own.
      - name: Skip if calibre-data already holds a newer commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Prints the body of a GET, or nothing for a verified 404. Any other
          # failure (a timeout, a 5xx, a rate limit) fails the run: taken as
          # "no tag", it would let an old re-run move the tag back (#2427).
          get() {
            local resp code
            if resp="$(gh api -i "$1" 2>/dev/null)"; then
              printf '%s\n' "$resp" | tr -d '\r' | sed '1,/^$/d'
              return 0
            fi
            code="$(printf '%s\n' "$resp" | head -n1 | awk '{print $2}')"
            [ "$code" = 404 ] && return 0
            echo "::error::GET $1 failed (HTTP ${code:-no response}); not taking that as absent." >&2
            return 1
          }
          ref="$(get "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          published=""
          if [ -n "$ref" ]; then
            published="$(jq -r .object.sha <<<"$ref")"
          fi
          release="$(get "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          has_asset=false
          if [ -n "$release" ] && jq -e --arg a "$ASSET" 'any(.assets[]; .name == $a)' <<<"$release" >/dev/null; then
            has_asset=true
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "asset=$has_asset" >> "$GITHUB_OUTPUT"
          status=new
          if [ -n "$published" ]; then
            status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${published}...${GITHUB_SHA}" --jq .status)"
          fi
          case "$status" in
            behind)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "calibre-data already holds $published, newer than $GITHUB_SHA. Nothing to do." ;;
            new|ahead|identical)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "calibre-data holds ${published:-nothing}; this commit is $status of it." ;;
            *)
              if [ "$DRY_RUN" = true ]; then
                echo "::error::calibre-data holds $published, which is $status of $GITHUB_SHA; merge main into ${GITHUB_REF_NAME} and run the dry run again."
              else
                echo "::error::calibre-data holds $published, which is $status of $GITHUB_SHA (not on its line); move it by hand."
              fi
              exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.head.outputs.publish == 'true'
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.head.outputs.publish == 'true'
        with:
          toolchain: stable
      # The same build as ci.yml's regress checks, so their cache serves it;
      # this job never saves one (the repository's caches are near the limit).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.head.outputs.publish == 'true'
        with:
          shared-key: regress
          save-if: false
      - name: Build
        if: steps.head.outputs.publish == 'true'
        run: cargo build --locked --release -p timegrapher-cli --no-default-features

      - name: Export and check
        if: steps.head.outputs.publish == 'true'
        id: export
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          ./target/release/timegrapher calibres export --json > "$out/calibres-export.json"
          # -n leaves out the file name and time from the gzip header. The
          # bytes still change with each build: the envelope's `software`
          # block names the commit and the build date.
          gzip -9 -n -c "$out/calibres-export.json" > "$out/$ASSET"
          # Read back the file that is uploaded, not the one before gzip:
          # the schema, one page per row of the table, no two at one path.
          python3 - "$out/$ASSET" crates/timegrapher-core/data/train-wheels.json <<'PY' >> "$GITHUB_OUTPUT"
          import gzip, json, sys
          with gzip.open(sys.argv[1], "rt", encoding="utf-8") as f:
              doc = json.load(f)
          want = "timegrapher.calibres-export/1"
          if doc.get("schema") != want:
              sys.exit(f"schema is {doc.get('schema')!r}, not {want!r}")
          calibres = doc.get("calibres")
          if not isinstance(calibres, list) or not calibres:
              sys.exit("the export holds no calibres")
          with open(sys.argv[2], encoding="utf-8") as f:
              rows = len(json.load(f))
          if len(calibres) != rows:
              sys.exit(f"the export has {len(calibres)} calibres, the table {rows} rows")
          paths = [c.get("path") for c in calibres]
          if None in paths or len(set(paths)) != len(paths):
              sys.exit("two calibres share a page path, or one has none")
          print(f"calibres={len(calibres)}")
          PY
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Compare with the published file
        if: steps.head.outputs.publish == 'true'
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.export.outputs.dir }}
          ASSET_PUBLISHED: ${{ steps.head.outputs.asset }}
        run: |
          set -euo pipefail
          # The first step found the release and its file, or verified they
          # are not there. A failed download of a file that is there fails
          # the run rather than counting as "nothing published".
          if [ "$ASSET_PUBLISHED" != true ]; then
            echo "Nothing published yet."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" \
            --output "$RUNNER_TEMP/published.json.gz"
          python3 - "$RUNNER_TEMP/published.json.gz" "$OUT/$ASSET" <<'PY' >> "$GITHUB_OUTPUT"
          import gzip, json, sys
          def body(path):
              try:
                  with gzip.open(path, "rt", encoding="utf-8") as f:
                      doc = json.load(f)
              except (OSError, ValueError):
                  return None
              doc.pop("software", None)
              return doc
          old, new = body(sys.argv[1]), body(sys.argv[2])
          same = old is not None and old == new
          print("changed=" + ("false" if same else "true"))
          print("Unchanged apart from the build details: nothing to publish." if same
                else "The export changed.", file=sys.stderr)
          PY

      - name: Move the calibre-data tag to this commit
        if: steps.diff.outputs.changed == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ steps.head.outputs.published }}
        run: |
          set -euo pipefail
          if [ -z "$PREV" ]; then
            # Fails (422) if a tag appeared since the first step looked.
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" --silent
          elif [ "$PREV" = "$GITHUB_SHA" ]; then
            echo "calibre-data already points at ${GITHUB_SHA}."
          else
            now="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
            if [ "$now" != "$PREV" ]; then
              echo "::error::calibre-data moved from $PREV to $now while this run built; not moving it."
              exit 1
            fi
            # force=false: GitHub refuses any move that is not forward.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="${GITHUB_SHA}" -F force=false --silent
          fi

      - name: Publish to the calibre-data pre-release
        if: steps.diff.outputs.changed == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.export.outputs.dir }}
          COUNT: ${{ steps.export.outputs.calibres }}
        run: |
          set -euo pipefail
          export TZ=UTC
          date="$(git log -1 --format=%cd --date=format-local:'%Y-%m-%d %H:%M UTC' "${GITHUB_SHA}")"
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "The calibre table as \`timegrapher calibres export --json\` writes it (\`timegrapher.calibres-export/1\`), for opentimegrapher.org's calibre pages. Replaced whenever the export changes; not an app release."
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Committed: ${date}"
            echo "- Calibres: ${COUNT}"
          } > "$notes"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Every run sets pre-release and not-latest again, so a hand
            # edit can't leave it the release the app's update check reads.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --prerelease --latest=false --draft=false \
              --title "Calibre data" --notes-file "$notes"
            gh release upload "$TAG" "$OUT/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$OUT/$ASSET" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --prerelease --latest=false \
              --title "Calibre data" --notes-file "$notes"
          fi

      # The app's update check (core update.rs) reads releases/latest. Run
      # even when an earlier step failed, since a half-made release is the
      # case to catch.
      - name: Check releases/latest is still an app release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          case "$latest" in
            v*) echo "releases/latest is $latest" ;;
            *) echo "::error::releases/latest is '$latest', not a v* app release; the app's update check would offer it"; exit 1 ;;
          esac

      # After a changed export, and on any run by hand or re-run even when
      # the export is unchanged, so a missed or failed call can be repeated
      # (#2310). Not on a dry run.
      - name: Ask the site to rebuild
        if: >-
          !inputs.dry_run && (steps.diff.outputs.changed == 'true'
          || github.event_name == 'workflow_dispatch' || github.run_attempt != '1')
        env:
          HOOK: ${{ secrets.CLOUDFLARE_SITE_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "No CLOUDFLARE_SITE_DEPLOY_HOOK secret: the site takes the new data on its next build."
            exit 0
          fi
          curl -fsS --retry 3 --retry-all-errors -X POST "$HOOK" -o /dev/null
          echo "Site rebuild requested."

      - name: Dry run report
        if: inputs.dry_run
        env:
          PREV: ${{ steps.head.outputs.published }}
          PUBLISH: ${{ steps.head.outputs.publish }}
          CHANGED: ${{ steps.diff.outputs.changed }}
          COUNT: ${{ steps.export.outputs.calibres }}
        run: |
          echo "Dry run on ${GITHUB_REF_NAME} at ${GITHUB_SHA}: calibre-data holds ${PREV:-nothing}."
          if [ "$PUBLISH" != true ]; then
            echo "A real run would publish nothing (calibre-data is newer) and ask the site to rebuild."
          elif [ "$CHANGED" = true ]; then
            echo "A real run would move the tag, publish ${COUNT} calibres and ask the site to rebuild."
          else
            echo "The export (${COUNT} calibres) is unchanged; a real run by hand would only ask the site to rebuild."
          fi
