name: Windows walkthrough

# A Windows desktop an agent drives live, for walkthroughs of the desktop app
# (.github/walkthrough/README.md). Started by hand; not part of CI.
#
# It builds the app at `ref` (and at `base_ref` when given), sets the display
# to 1920 x 1080, opens the head build, then for `minutes` serves step files
# pushed to walk/cmd/ on the `channel` branch, answering each with a
# screenshot in walk/out/ on that branch.
#
# `ref` and `base_ref` must be branch names of this repository. They are
# built in a job with read-only permission and handed to the walk job as an
# artifact. The walk job, where the app under test runs, reads only: it
# uploads each answer as an artifact of this run. The relay job, on another
# runner that never runs the app, holds the token that can push and pushes
# each answer to the channel (#2426; .github/walkthrough/answers.py).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of this repository to walk (the PR head)
        required: true
      base_ref:
        description: Optional branch of this repository to compare against (the PR base)
        required: false
        default: ''
      channel:
        description: Branch the agent pushes steps to and reads answers from
        required: true
      minutes:
        description: How long the session serves steps
        required: false
        default: '120'

permissions:
  contents: read

concurrency:
  group: windows-walkthrough-${{ inputs.channel }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      # Run from the channel branch (the Actions tab's "Use workflow from"),
      # never main: the walk job's artifact credentials can also save caches,
      # and a run's caches belong to the branch it runs from, so the app
      # under test could otherwise plant a cache that main's runs read.
      - name: Run from the channel branch
        if: github.ref != format('refs/heads/{0}', inputs.channel) || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          echo "::error::Run this workflow from the channel branch (not main), with channel set to it"
          exit 1
      - name: Only branches of this repository
        shell: bash
        env:
          HEAD_REF: ${{ inputs.ref }}
          BASE_REF: ${{ inputs.base_ref }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          for r in "$HEAD_REF" "$BASE_REF"; do
            [ -z "$r" ] && continue
            if ! git ls-remote --exit-code --heads "$REPO_URL" "refs/heads/$r" >/dev/null; then
              echo "::error::$r is not a branch of this repository"; exit 1
            fi
          done
      - name: Head source
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ inputs.ref }}
          path: head
          persist-credentials: false
      - name: Base source
        if: inputs.base_ref != ''
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ inputs.base_ref }}
          path: base
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-walkthrough
          save-if: false
          workspaces: |
            head
            base
      - name: Build head
        working-directory: head
        run: cargo build --release -p timegrapher-app
      - name: Build base
        if: inputs.base_ref != ''
        working-directory: base
        run: cargo build --release -p timegrapher-app
      - name: Collect the builds
        shell: bash
        run: |
          mkdir -p apps
          cp head/target/release/timegrapher-app.exe apps/head.exe
          [ -f base/target/release/timegrapher-app.exe ] && cp base/target/release/timegrapher-app.exe apps/base.exe
          ls -la apps
      - uses: actions/upload-artifact@v4
        with:
          name: walk-apps
          path: apps/
          retention-days: 1

  walk:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Tool scripts
        uses: actions/checkout@v7
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/walkthrough
      - name: Builds
        uses: actions/download-artifact@v4
        with:
          name: walk-apps
          path: apps
      - name: Channel branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.channel }}
          path: channel
          persist-credentials: false
      - name: Display 1920 x 1080
        shell: pwsh
        run: ./tool/.github/walkthrough/display.ps1
      - name: Driver
        run: python -m pip install --quiet pyautogui==0.9.54 pillow==11.0.0
      # The run's artifact credentials, which only actions see, for the
      # driver's answer uploads. They can't push to the repository.
      - name: Answer credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN)
            core.exportVariable('WALK_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN)
            core.exportVariable('WALK_RESULTS_URL', process.env.ACTIONS_RESULTS_URL)
      - name: Serve steps
        shell: bash
        env:
          WALK_CHANNEL: ${{ inputs.channel }}
          WALK_MINUTES: ${{ inputs.minutes }}
        run: |
          base=""
          [ -f apps/base.exe ] && base=apps/base.exe
          python tool/.github/walkthrough/driver.py channel apps/head.exe $base
      - name: App logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-logs
          path: walk-logs/
          if-no-files-found: ignore

  # Pushes the walk job's answers to the channel. The only job holding a
  # token that can push; it runs no code from `ref`, `base_ref` or the
  # channel, and git runs without hooks.
  relay:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - name: Tool scripts
        uses: actions/checkout@v7
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/walkthrough
      - name: Channel branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.channel }}
          path: channel
          persist-credentials: false
      - name: Relay answers
        env:
          GH_TOKEN: ${{ github.token }}
          WALK_TOKEN: ${{ github.token }}
          WALK_CHANNEL: ${{ inputs.channel }}
        run: python3 tool/.github/walkthrough/relay.py channel
